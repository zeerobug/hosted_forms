<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Personal Info Form</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-indigo-100 via-purple-50 to-pink-100 flex items-center justify-center p-4">
  <div class="w-full max-w-lg bg-white rounded-2xl shadow-xl p-8 sm:p-10">
    <div class="mb-8 text-center">
      <h1 class="text-2xl sm:text-3xl font-bold text-gray-800">Personal Information</h1>
      <p class="text-gray-500 mt-2 text-sm sm:text-base">Please fill in your details below</p>
    </div>

    <form method="POST" action="" class="space-y-6">
      <div>
        <label for="name" class="block text-sm font-semibold text-gray-700 mb-1">Name</label>
        <input
          type="text"
          id="name"
          name="Name"
          placeholder="Enter your full name"
          required
          class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-gray-800 placeholder-gray-400 shadow-sm focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition"
        />
      </div>

      <div>
        <label for="dob" class="block text-sm font-semibold text-gray-700 mb-1">Date of birth</label>
        <input
          type="date"
          id="dob"
          name="Date of birth"
          required
          class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-gray-800 shadow-sm focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition"
        />
      </div>

      <div>
        <label for="comment" class="block text-sm font-semibold text-gray-700 mb-1">Comment</label>
        <textarea
          id="comment"
          name="comment"
          rows="4"
          placeholder="Write your comment here..."
          class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-gray-800 placeholder-gray-400 shadow-sm focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition resize-none"
        ></textarea>
      </div>

      <button
        type="submit"
        class="w-full bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-semibold py-2.5 rounded-lg shadow-md transition duration-150 ease-in-out focus:outline-none focus:ring-2 focus:ring-indigo-300"
      >
        Submit
      </button>
    </form>
  </div>
</body>
</html>
