<script src="https://cdn.tailwindcss.com"></script>
<div class="min-h-[400px] flex items-center justify-center bg-gradient-to-br from-slate-100 to-slate-200 p-6">
  <form action="https://s.submitrax.com/8f73f56656ef66713525fcaf526ec5a8" method="POST"
        class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8 space-y-6 border border-slate-200">
    <div class="text-center space-y-1">
      <h2 class="text-2xl font-bold text-slate-800">Hosted Form 2</h2>
      <p class="text-sm text-slate-500">Please fill in your details below.</p>
    </div>

    <div class="space-y-1">
      <label for="name" class="block text-sm font-medium text-slate-700">Name</label>
      <input type="text" id="name" name="name" placeholder="Your full name" required
             class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition" />
    </div>

    <div class="space-y-1">
      <label for="dob" class="block text-sm font-medium text-slate-700">Date of birth</label>
      <input type="date" id="dob" name="date_of_birth" required
             class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition" />
    </div>

    <div class="space-y-1">
      <label for="comment" class="block text-sm font-medium text-slate-700">Comment</label>
      <textarea id="comment" name="comment" rows="4" placeholder="Write your comment here..."
                class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition resize-none"></textarea>
    </div>

    <button type="submit"
            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg shadow-md transition-colors">
      Submit
    </button>
  </form>
</div>
