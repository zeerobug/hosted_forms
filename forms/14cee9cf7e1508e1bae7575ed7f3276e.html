<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Form</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-100 to-slate-300 min-h-screen flex items-center justify-center p-6">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8">
    <h1 class="text-2xl font-bold text-slate-800 mb-1">Get in touch</h1>
    <p class="text-slate-500 text-sm mb-6">Fill out the form below and we'll get back to you.</p>

    <form method="POST" action="{{FORM_ACTION}}" class="space-y-5">
      <div>
        <label for="name" class="block text-sm font-medium text-slate-700 mb-1">Name</label>
        <input
          type="text"
          id="name"
          name="name"
          required
          placeholder="Your full name"
          class="w-full rounded-lg border border-slate-300 px-4 py-2.5 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition"
        />
      </div>

      <div>
        <label for="dob" class="block text-sm font-medium text-slate-700 mb-1">Date of birth</label>
        <input
          type="date"
          id="dob"
          name="date_of_birth"
          required
          class="w-full rounded-lg border border-slate-300 px-4 py-2.5 text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition"
        />
      </div>

      <div>
        <label for="comment" class="block text-sm font-medium text-slate-700 mb-1">Comment</label>
        <textarea
          id="comment"
          name="comment"
          rows="4"
          placeholder="Write your comment here..."
          class="w-full rounded-lg border border-slate-300 px-4 py-2.5 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition resize-none"
        ></textarea>
      </div>

      <button
        type="submit"
        class="w-full bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-semibold py-2.5 rounded-lg shadow-sm transition"
      >
        Submit
      </button>
    </form>
  </div>
</body>
</html>
