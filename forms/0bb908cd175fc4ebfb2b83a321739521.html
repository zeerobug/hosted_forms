<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Personal Info Form</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-white to-purple-50 min-h-screen flex items-center justify-center p-6">
  <div class="w-full max-w-lg bg-white shadow-xl rounded-2xl p-8 border border-gray-100">
    <h1 class="text-2xl font-bold text-gray-800 mb-1 text-center">Personal Information</h1>
    <p class="text-gray-500 text-sm mb-6 text-center">Please fill out the form below.</p>

    <form method="POST" action="https://s.submitrax.com/0bb908cd175fc4ebfb2b83a321739521" class="space-y-5">
      <div>
        <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Name</label>
        <input
          type="text"
          id="name"
          name="name"
          required
          placeholder="Enter your full name"
          class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-400 focus:border-indigo-400 outline-none transition"
        />
      </div>

      <div>
        <label for="dob" class="block text-sm font-medium text-gray-700 mb-1">Date of Birth</label>
        <input
          type="date"
          id="dob"
          name="date_of_birth"
          required
          class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-400 focus:border-indigo-400 outline-none transition"
        />
      </div>

      <div>
        <label for="comment" class="block text-sm font-medium text-gray-700 mb-1">Comment</label>
        <textarea
          id="comment"
          name="comment"
          rows="4"
          placeholder="Write your comment here..."
          class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-400 focus:border-indigo-400 outline-none transition resize-none"
        ></textarea>
      </div>

      <button
        type="submit"
        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg transition shadow-md hover:shadow-lg"
      >
        Submit
      </button>
    </form>
  </div>
</body>
</html>
